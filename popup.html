<!DOCTYPE html>
<html>
<head>
  <title>Page Performance Monitor</title>
  <style>
    body {
      width: 400px;
      font-family: Arial, sans-serif;
      padding: 10px;
    }
    .metric {
      margin-bottom: 10px;
    }
    .metric-name {
      font-weight: bold;
    }
    .script-item {
      margin: 5px 0;
      padding: 5px;
      background-color: #f5f5f5;
      border-radius: 3px;
    }
    .no-data {
      color: #888;
      font-style: italic;
    }
    h2 {
      margin-top: 15px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
    }
    .toggle-link {
      color: #0066cc;
      cursor: pointer;
      text-decoration: underline;
      display: inline-block;
      margin-left: 10px;
    }
    .toggle-link:hover {
      color: #004080;
    }
    .scripts-container {
      display: none;
      margin-top: 10px;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <h1>Page Performance Monitor</h1>
  <div id="performance-data">
    <p class="no-data">Loading performance data...</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
